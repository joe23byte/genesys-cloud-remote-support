# coturn configuration for Remote Support for Genesys Cloud.
#
# Authentication uses the TURN REST API scheme ("use-auth-secret"): the app issues
# short-lived credentials signed with TURN_SECRET; the same value must be passed to
# coturn as --static-auth-secret (docker-compose does this). No static user list.
#
# Ports to open in the firewall / security group:
#   3478/udp + 3478/tcp   TURN (plain, credentials are still required)
#   5349/tcp              TURN over TLS (turns:), only if cert/pkey below are configured
#   49160-49200/udp       relay ports (adjust min-port/max-port; ~2 ports per active session)

listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

use-auth-secret
# static-auth-secret is passed on the command line (--static-auth-secret=...).
# realm is passed on the command line (--realm=...).

fingerprint
no-cli
no-multicast-peers
no-software-attribute
stale-nonce=600
user-quota=12
total-quota=1200

# TLS for turns: (strongly recommended for customers behind proxies that only allow 443/TLS).
# Mount the certificate files and uncomment:
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
# cipher-list="ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
# no-tlsv1
# no-tlsv1_1

# Never relay into private / loopback / link-local networks (prevents abuse of the
# TURN server as a proxy into the hosting network).
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
